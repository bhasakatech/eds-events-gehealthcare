<main>
  <div>
    <div class="product">
      <div>
        <div>
          <p>
            <picture>
              <img src="{{thumbnail}}" alt="{{title}}">
            </picture>
          </p>
        </div>

        <div>
          <p>{{category}}</p>
          <h1>{{title}}</h1>
          <p>{{description}}</p>
          <p>${{price}}</p>
          <p>Rating: {{rating}} / 5</p>
          <p>{{availabilityStatus}} · {{stock}} in stock</p>
          <p>SKU: {{sku}}</p>
          <p>Warranty: {{warrantyInformation}}</p>
          <p>Shipping: {{shippingInformation}}</p>
          <p>Returns: {{returnPolicy}}</p>
        </div>
      </div>
    </div>
  </div>
</main>
